name: Test check-name that never ran fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: actions/checkout
          ref: de0fac2e4500dabe0009e67214ff5f5447ce83dd
          repo-token: ${{ github.token }}
          wait-interval: "5"
          check-name: this-check-does-not-exist-xyz-12345
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a check that never ran"
            exit 1
          fi
          echo "PASS"
