name: Test disallowed conclusions fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # check-regexp '.*' matches every check; no real conclusion equals
      # 'not-a-real-conclusion', so the action must fail (either because a
      # conclusion is not allowed, or because no check ran at all).
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: actions/checkout
          ref: de0fac2e4500dabe0009e67214ff5f5447ce83dd
          repo-token: ${{ github.token }}
          wait-interval: "5"
          check-regexp: '.*'
          allowed-conclusions: not-a-real-conclusion
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for disallowed conclusions"
            exit 1
          fi
          echo "PASS"
